<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>السلة | Wishes</title>
  <meta name="description" content="سلة التسوق وفاتورة الطلب في متجر Wishes." />
  <meta name="theme-color" content="#c2477f" />
  <link rel="icon" type="image/png" href="/images/wishes-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="cart">

<!-- Icon sprite, injected before the markup below is parsed. -->
<script src="/sprite.js"></script>

<!-- Header, footer and floating button are rendered by src/layout.js -->
<header class="site-header" id="top"></header>

<main>
  <!-- Cart, filled by src/main.js from the browser's saved cart -->
  <section class="section">
    <div class="container">
      <div class="section-head reveal">
        <p class="eyebrow">طلبك</p>
        <h1>سلة التسوق</h1>
        <p class="section-sub">عدّلي الكميات أو احذفي أي منتج، وستجدين الفاتورة الكاملة في الأسفل.</p>
      </div>
      <div id="cart-root"></div>
      <!-- Checkout form, filled by src/checkout.js; shown by "إكمال الطلب" -->
      <div id="checkout-root" hidden></div>
    </div>
  </section>
</main>

<footer class="site-footer"></footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
