<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المنتج | Wishes</title>
  <meta name="description" content="تفاصيل المنتج، السعر والكمية — من متجر Wishes." />
  <meta name="theme-color" content="#c2477f" />
  <link rel="icon" type="image/png" href="/images/wishes-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="product">

<!-- Icon sprite, injected before the markup below is parsed. -->
<script src="/sprite.js"></script>

<!-- Header, footer and floating button are rendered by src/layout.js -->
<header class="site-header" id="top"></header>

<main>
  <!-- Product detail, filled by src/main.js from the ?id= in the URL -->
  <section class="section">
    <div class="container" id="product-detail"></div>
  </section>

  <section class="section section-tint">
    <div class="container">
      <div class="section-head reveal">
        <p class="eyebrow">قد يعجبك أيضاً</p>
        <h2>منتجات أخرى</h2>
      </div>
      <div class="products" id="related-grid"></div>
    </div>
  </section>
</main>

<footer class="site-footer"></footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
