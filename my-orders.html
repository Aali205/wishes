<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رحلة طلباتي | Wishes</title>
  <meta name="description" content="تابعي حالة طلباتك من Wishes خطوة بخطوة." />
  <meta name="theme-color" content="#c2477f" />
  <link rel="icon" type="image/png" href="/images/wishes-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="orders">

<!-- Icon sprite, injected before the markup below is parsed. -->
<script src="/sprite.js"></script>

<!-- Header, footer and floating button are rendered by src/layout.js -->
<header class="site-header" id="top"></header>

<main>
  <!-- Orders, filled by src/orders.js from this device's saved orders -->
  <section class="section">
    <div class="container">
      <div class="section-head reveal">
        <p class="eyebrow">طلباتك</p>
        <h1>رحلة طلباتي</h1>
        <p class="section-sub">تابعي كل طلب من لحظة استلامه حتى يصل إلى بابك.</p>
      </div>

      <div id="orders-list" class="journey-list"></div>

      <form id="track-form" class="checkout track-form reveal" novalidate>
        <h2>ابحثي عن طلب</h2>
        <p class="checkout-hint">طلبتِ من جهاز آخر؟ اكتبي رقم الطلب ورقم الهاتف الذي طلبتِ به.</p>
        <div class="track-fields">
          <label class="field">
            <span>رقم الطلب</span>
            <input name="id" type="text" dir="ltr" placeholder="W-XXXXXXXX" autocomplete="off" required />
          </label>
          <label class="field">
            <span>رقم الهاتف</span>
            <input name="phone" type="tel" inputmode="tel" dir="ltr" placeholder="09xx xxx xxx" autocomplete="tel" required />
          </label>
          <button type="submit" class="btn btn-primary">تتبّعي الطلب</button>
        </div>
        <p class="field-error" data-error role="alert"></p>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer"></footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
