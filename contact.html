<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تواصلي معنا | Wishes</title>
  <meta name="description" content="راسلي Wishes على إنستغرام لأي استفسار أو طلب." />
  <meta name="theme-color" content="#c2477f" />
  <link rel="icon" type="image/png" href="/images/wishes-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="contact">

<!-- Icon sprite, injected before the markup below is parsed. -->
<script src="/sprite.js"></script>

<!-- Header, footer and floating button are rendered by src/layout.js -->
<header class="site-header" id="top"></header>

<main>
  <!-- Instagram CTA -->
  <section class="section" id="contact">
    <div class="container">
      <div class="cta reveal">
        <svg class="sparkle cta-s1"><use href="#i-sparkle" /></svg>
        <svg class="sparkle cta-s2"><use href="#i-sparkle" /></svg>
        <p class="eyebrow">تواصلي معنا</p>
        <h1>أمنيتك القادمة بانتظارك</h1>
        <p class="section-sub">
          تابعي أحدث المنتجات والعروض على إنستغرام، وراسلينا لأي استفسار أو طلب — نرد عليكِ بأسرع وقت.
        </p>
        <div class="cta-actions">
          <a class="btn btn-primary" href="https://www.instagram.com/wishes.sy/" target="_blank" rel="noopener">
            <svg class="icon"><use href="#i-instagram" /></svg>
            @wishes.sy
          </a>
          <a class="btn btn-ghost" href="https://ig.me/m/wishes.sy" target="_blank" rel="noopener">
            أرسلي رسالة مباشرة
          </a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer"></footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
