<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المنتجات | Wishes</title>
  <meta name="description" content="كل منتجات Wishes مع الأسعار — أضيفيها إلى السلة واطلبيها عبر إنستغرام." />
  <meta name="theme-color" content="#c2477f" />
  <link rel="icon" type="image/png" href="/images/wishes-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="products">

<!-- Icon sprite, injected before the markup below is parsed. -->
<script src="/sprite.js"></script>

<!-- Header, footer and floating button are rendered by src/layout.js -->
<header class="site-header" id="top"></header>

<main>
  <!-- Products -->
  <section class="section section-tint" id="products">
    <div class="container">
      <div class="section-head reveal">
        <p class="eyebrow">الأكثر طلباً</p>
        <h1>منتجات تحبّينها</h1>
        <p class="section-sub">اختاري الكمية وأضيفي ما يعجبك إلى السلة، ثم أرسلي طلبك عبر إنستغرام.</p>
      </div>

      <div class="filters" role="tablist" aria-label="تصفية المنتجات">
        <button type="button" class="chip is-active" data-filter="all">الكل</button>
        <button type="button" class="chip" data-filter="fragrance">عطور</button>
        <button type="button" class="chip" data-filter="body">عناية بالجسم</button>
        <button type="button" class="chip" data-filter="hair">عناية بالشعر</button>
        <button type="button" class="chip" data-filter="makeup">مكياج</button>
      </div>

      <div class="products" id="product-grid"></div>
    </div>
  </section>
</main>

<footer class="site-footer"></footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
